name: Portfolio CI and Docker CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required files
        run: |
          test -f index.html
          test -f style.css
          test -f Dockerfile
          test -f README.md
          echo "Required project files exist."

      - name: Validate HTML content
        run: |
          grep -qi '<title>.*</title>' index.html
          grep -q 'FA23-BAI-064' index.html
          grep -q 'id="labs"' index.html
          echo "HTML title, roll number and Labs section validated."

      - name: Validate Docker configuration
        run: |
          grep -q 'FROM nginx:alpine' Dockerfile
          grep -q 'COPY index.html' Dockerfile
          grep -q 'COPY style.css' Dockerfile
          echo "Dockerfile checks passed."

      - name: Build Docker image
        run: docker build -t sabahayat/devops-a2:ci .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push latest image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag sabahayat/devops-a2:ci sabahayat/devops-a2:latest
          docker push sabahayat/devops-a2:latest
